name: ai_child_guardian
description: "AI Child Guardian - Intelligent Child Safety & Emergency Monitoring System"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ---- UI ----
  cupertino_icons: ^1.0.6
  google_fonts: ^6.2.1          # Poppins / Inter fonts

  # ---- Firebase ----
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4

  # ---- GPS & Maps ----
  geolocator: ^13.0.1
  google_maps_flutter: ^2.9.0
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
